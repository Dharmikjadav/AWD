<div class="container">
  <!-- Page Header -->
  <div class="page-header">
    <h2 class="page-title"><i class="bi bi-box-seam"></i> Manage Packages</h2>
    <p class="page-subtitle">Create and manage tour packages</p>
  </div>

  <button class="btn btn-primary add-btn" (click)="openAddModal()">
    <i class="bi bi-plus-circle"></i> Add New Package
  </button>

  <div class="package-grid mt-5">
    <div class="package-card" *ngFor="let pkg of packages">
      <div class="card-header">
        <h3><i class="bi bi-pin-map-fill"></i> {{ pkg.package_name }}</h3>
      </div>

      <div class="card-body">
        <div class="description-section">
          <label class="section-label">Highlights:</label>
          <ul class="description-list">
            <li *ngFor="let line of pkg.description.split(',')">
              <i class="bi bi-check2-circle"></i> {{ line.trim() }}
            </li>
          </ul>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="bi bi-calendar-event"></i> Duration</span>
          <span class="info-value">{{ pkg.duration_days }} days</span>
        </div>

        <div class="price-section">
          <label class="section-label">Price</label>
          <div class="price">₹ {{ pkg.price }}</div>
        </div>
      </div>

      <div class="card-footer">
        <button class="btn btn-sm btn-primary" (click)="editPackage(pkg)">
          <i class="bi bi-pencil-square"></i> Edit
        </button>
        <button class="btn btn-sm btn-danger" (click)="deletePackage(pkg)">
          <i class="bi bi-trash3"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>



<!-- Bootstrap Modal -->
<div class="modal fade" id="addPackageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ editMode ? 'Edit Package' : 'Add New Package' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form [formGroup]="addpackage" (ngSubmit)="addPackage()">

          <div class="mb-3">
            <label class="form-label">Package Name</label>
            <input type="text" class="form-control" formControlName="package_name" 
              [ngClass]="{'is-invalid': addpackage.get('package_name')?.invalid && addpackage.get('package_name')?.touched}" />
            <div class="text-danger" *ngIf="addpackage.get('package_name')?.invalid && addpackage.get('package_name')?.touched"><small>Package name is required.</small></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" formControlName="description"
              [ngClass]="{'is-invalid': addpackage.get('description')?.invalid && addpackage.get('description')?.touched}"></textarea>
            <div class="text-danger" *ngIf="addpackage.get('description')?.invalid && addpackage.get('description')?.touched"><small>Description is required.</small></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" formControlName="price" 
              [ngClass]="{'is-invalid': addpackage.get('price')?.invalid && addpackage.get('price')?.touched}" />
            <div class="text-danger" *ngIf="addpackage.get('price')?.invalid && addpackage.get('price')?.touched"><small>Price is required.</small></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Duration (Days)</label>
            <input type="number" class="form-control" formControlName="duration_days" 
              [ngClass]="{'is-invalid': addpackage.get('duration_days')?.invalid && addpackage.get('duration_days')?.touched}" />
            <div class="text-danger" *ngIf="addpackage.get('duration_days')?.invalid && addpackage.get('duration_days')?.touched"><small>Duration is required.</small></div>
          </div>

          <div class="text-end">
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" class="btn btn-success">
              {{ editMode ? 'Update Package' : 'Add Package' }}
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
