<div class="table-container">

  <h2>Contact Messages</h2>

  <div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && contacts.length === 0" class="text-center my-4 text-muted">
    <i class="bi bi-inbox fs-1"></i>
    <p class="mt-2">No contact messages found.</p>
  </div>

  <table *ngIf="!loading && contacts.length > 0">
    <thead>
      <tr>
        <th>No</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let contact of contacts; let idx = index;">
        <td>{{ idx + 1 }}</td>
        <td>{{ contact.fname }}</td>
        <td>{{ contact.email }}</td>
        <td>{{ contact.message }}</td>
        <td>
          <button type="button" class="btn btn-danger btn-sm m-2" (click)="deleteContact(contact)">
            <i class="bi bi-trash"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
